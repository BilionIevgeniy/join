<button type="button" class="checkbox-button" (click)="toggle()">
  <img
    [src]="'assets/icons/' + icon"
    alt=""
    class="checkbox-button__icon"
    [class.checkbox-button__icon--pop]="justChecked()"
  />
  @if (label()) {
    <span class="checkbox-button__label">{{ label() }}</span>
  }
</button>
