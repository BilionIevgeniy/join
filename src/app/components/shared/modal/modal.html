@if (modalService.isOpen()) {
  <div
    class="modal-overlay"
    [class.modal-overlay--closing]="modalService.isClosing()"
    (click)="onBackdropClick()"
  >
    <div
      #host
      class="modal-overlay__panel"
      [class.modal-overlay__panel--closing]="modalService.isClosing()"
      (click)="$event.stopPropagation()"
    ></div>
  </div>
}
