<button
  class="priority-btn"
  type="button"
  [class.priority-btn--selected]="selected()"
  [style.--priority-color]="config.color"
  (click)="onClick()"
>
  {{ config.label }}
  <svg
    class="priority-btn__icon"
    viewBox="0 0 21 16"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    @switch (priority()) {
      @case ('urgent') {
        <path
          d="M1 8.5L10.5 1L20 8.5"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M1 15L10.5 7.5L20 15"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      }
      @case ('medium') {
        <line x1="1" y1="5" x2="20" y2="5" stroke-width="2.5" stroke-linecap="round" />
        <line x1="1" y1="11" x2="20" y2="11" stroke-width="2.5" stroke-linecap="round" />
      }
      @case ('low') {
        <path
          d="M1 1L10.5 8.5L20 1"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="M1 7.5L10.5 15L20 7.5"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      }
    }
  </svg>
</button>
