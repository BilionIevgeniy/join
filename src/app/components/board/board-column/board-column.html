<div class="board-column">
  <div class="board-column__header">
    <h2 class="board-column__title">{{ title() }}</h2>
    @if (showAddIcon()) {
      <button
        type="button"
        class="board-column__add-btn"
        (click)="addTask.emit(status())"
        aria-label="Add task"
      >
        <img src="/assets/icons/add-plus-icon-default.svg" alt="" />
      </button>
    }
  </div>

  <div
    class="board-column__list"
    [class.board-column__list--drop-target]="isDragOver()"
    (dragenter)="onDragEnter($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    @if (tasks().length > 0) {
      @for (task of tasks(); track task.id) {
        <app-task-card
          [task]="task"
          (opened)="taskOpened.emit($event)"
          (moveTo)="onTaskMoveTo(task, $event)"
        />
      }
    } @else {
      <div class="board-column__empty">No tasks in {{ title() }}</div>
    }
  </div>
</div>
