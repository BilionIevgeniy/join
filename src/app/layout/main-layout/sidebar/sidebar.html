<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar__logo">
    <img src="assets/img/join-logo-white.svg" alt="Join Logo" />
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar__nav">
    <ul class="nav-list">
      @if (isLoggedIn()) {
        @for (item of navItems; track item.route) {
          <li
            class="nav-item"
            routerLinkActive="nav-item--active"
            [routerLinkActiveOptions]="{
              paths: 'exact',
              queryParams: 'ignored',
              fragment: 'ignored',
              matrixParams: 'ignored',
            }"
          >
            <a [routerLink]="'/' + item.route">
              <img [src]="item.icon" [alt]="item.label" class="nav-icon" />
              <span class="nav-text">{{ item.label }}</span>
            </a>
          </li>
        }
      } @else {
        <li
          class="nav-item nav-item--login"
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{
            paths: 'exact',
            queryParams: 'ignored',
            fragment: 'ignored',
            matrixParams: 'ignored',
          }"
        >
          <a routerLink="/login">
            <img src="assets/icons/login-icon.svg" alt="Log In" class="nav-icon" />
            <span class="nav-text">Log In</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Footer Links -->
  <footer class="sidebar__footer" [class.sidebar__footer--visible]="!isLoggedIn()">
    <a
      routerLink="/privacy-policy"
      routerLinkActive="footer-link--active"
      [routerLinkActiveOptions]="{
        paths: 'exact',
        queryParams: 'ignored',
        fragment: 'ignored',
        matrixParams: 'ignored',
      }"
      >Privacy Policy</a
    >
    <a
      routerLink="/legal-notice"
      routerLinkActive="footer-link--active"
      [routerLinkActiveOptions]="{
        paths: 'exact',
        queryParams: 'ignored',
        fragment: 'ignored',
        matrixParams: 'ignored',
      }"
      >Legal notice</a
    >
  </footer>
</aside>
