<header class="header">
  <div class="header__content">
    <!-- Leerer Platz (später: Breadcrumbs) -->
    <div class="header__breadcrumb">
      <!-- Logo nur im Responsive sichtbar -->
      <img src="assets/img/join-logo-dark.svg" alt="Join Logo" class="header__logo" />
    </div>

    <!-- Benutzer Sektion rechts -->
    @if (isLoggedIn()) {
      <div class="header__user">
        <!-- Hilfenachricht -->
        <button class="help-button" title="Help"></button>

        <!-- Benutzer Dropdown -->
        <div class="user-dropdown">
          <button class="user-button" (click)="toggleDropdown()">
            <app-avatar
              [size]="'medium'"
              [initials]="userInitials()"
              [color]="userColor()"
              [border]="'2px solid var(--bg-color)'"
            ></app-avatar>
          </button>

          <!-- Dropdown Menü -->
          @if (isDropdownOpen()) {
            <div class="dropdown-menu" [class.dropdown-menu--closing]="isDropdownClosing()">
              <a href="#" class="dropdown-item">Legal Notice</a>
              <a href="#" class="dropdown-item">Privacy Policy</a>
              <a href="#" class="dropdown-item">Log out</a>
            </div>
          }
        </div>
      </div>
    }
  </div>
</header>
