<header class="header">
  <div class="header__content">
    <!-- Titel nur im Desktop sichtbar -->
    <div class="header__breadcrumb">
      <span class="header__title">Kanban Project Management Tool</span>
      <!-- Logo nur im Responsive sichtbar -->
      <img src="assets/img/join-logo-dark.svg" alt="Join Logo" class="header__logo" />
    </div>

    <!-- Benutzer Sektion rechts -->
    @if (isLoggedIn()) {
      <div class="header__user">
        <!-- Hilfenachricht: nur Desktop sichtbar -->
        <button class="help-button" title="Help" routerLink="/help"></button>

        <!-- Benutzer Dropdown -->
        <div class="user-dropdown">
          <button class="user-button" (click)="toggleDropdown()">
            <app-avatar
              [size]="'medium'"
              [initials]="userInitials()"
              [color]="userColor()"
              [border]="'2px solid var(--bg-color)'"
            ></app-avatar>
          </button>

          <!-- Dropdown Menü -->
          @if (isDropdownOpen()) {
            <div class="dropdown-menu" [class.dropdown-menu--closing]="isDropdownClosing()">
              <a routerLink="/help" class="dropdown-item dropdown-item--mobile-help">Help</a>
              <a routerLink="/legal-notice" class="dropdown-item">Legal Notice</a>
              <a routerLink="/privacy-policy" class="dropdown-item">Privacy Policy</a>
              <a class="dropdown-item" (click)="logout()">Log out</a>
            </div>
          }
        </div>
      </div>
    }
  </div>
</header>
