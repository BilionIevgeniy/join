<header class="header">
  <div class="header__content">
    <!-- Leerer Platz (später: Breadcrumbs) -->
    <div class="header__breadcrumb">
      <!-- Logo nur im Responsive sichtbar -->
      <img src="/assets/img/join-logo-dark.svg" alt="Join Logo" class="header__logo" />
    </div>

    <!-- Benutzer Sektion rechts -->
    <div class="header__user">
      <!-- Hilfenachricht -->
      <button class="help-button" title="Help"></button>

      <!-- Benutzer Dropdown -->
      <div class="user-dropdown">
        <button class="user-button" (click)="toggleDropdown()">
          <app-avatar [initials]="userInitials()"></app-avatar>
        </button>

        <!-- Dropdown Menü -->
        <div class="dropdown-menu" *ngIf="isDropdownOpen()">
          <div class="dropdown-header">
            <app-avatar [initials]="userInitials()"></app-avatar>
            <div>
              <div class="dropdown-email">{{ userEmail() }}</div>
            </div>
          </div>
          <hr />
          <a href="#" class="dropdown-item">My Account</a>
          <a href="#" class="dropdown-item">Settings</a>
          <hr />
          <a href="#" class="dropdown-item logout">Logout</a>
        </div>
      </div>
    </div>
  </div>
</header>
