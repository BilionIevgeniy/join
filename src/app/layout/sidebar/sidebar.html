<aside class="sidebar">
  <!-- Logo -->
  <div class="sidebar__logo">
    <img src="/assets/img/join-logo-white.svg" alt="Join Logo" />
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar__nav">
    <ul class="nav-list">
      <li class="nav-item">
        <a 
          routerLink="/summary" 
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <img src="/assets/icons/summary-icon.svg" alt="Summary" class="nav-icon" />
          <span class="nav-text">Summary</span>
        </a>
      </li>

      <li class="nav-item">
        <a 
          routerLink="/board" 
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <img src="/assets/icons/board-icon.svg" alt="Board" class="nav-icon" />
          <span class="nav-text">Board</span>
        </a>
      </li>

      <li class="nav-item">
        <a 
          routerLink="/add-task" 
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <img src="/assets/icons/add-task-icon.svg" alt="Add Task" class="nav-icon" />
          <span class="nav-text">Add Task</span>
        </a>
      </li>

      <li class="nav-item">
        <a 
          routerLink="/contacts" 
          routerLinkActive="nav-item--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <img src="/assets/icons/contacts-icon.svg" alt="Contacts" class="nav-icon" />
          <span class="nav-text">Contacts</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer Links -->
  <footer class="sidebar__footer">
    <a href="#">Privacy Policy</a>
    <a href="#">Legal notice</a>
  </footer>
</aside>
