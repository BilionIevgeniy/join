<div class="board-page">
  <div class="board-page__header">
    <h1 class="board-page__title">Board</h1>
    <div class="board-page__search-wrapper">
      <app-search-input placeholder="Find Task" (searchChange)="onSearchChange($event)" />
    </div>
    <app-button
      class="board-page__add-task-btn legacy-primary"
      variant="primary"
      [size]="isMobile() ? 'xxsmall' : 'small'"
      weight="bold"
      fontSize="large"
      [label]="isMobile() ? '' : 'Add task'"
      icon="add-plus-white-icon.svg"
      (click)="onAddTask('todo')"
    />
  </div>

  <app-board
    [columns]="columns()"
    (addTask)="onAddTask($event)"
    (taskOpened)="onTaskOpened($event)"
    (taskMoved)="onTaskMoved($event)"
  />
</div>
