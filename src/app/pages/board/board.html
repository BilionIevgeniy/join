<div class="board-page">
  <div class="board-page__header">
    <h1 class="board-page__title">Board</h1>
    <div class="board-page__actions">
      <app-search-input placeholder="Find Task" (searchChange)="onSearchChange($event)" />
      <app-button
        class="board-page__add-task-btn"
        variant="primary"
        size="small"
        weight="bold"
        fontSize="large"
        label="Add task"
        icon="add-plus-white-icon.svg"
        (click)="onAddTask('todo')"
      />
    </div>
  </div>

  <app-board [columns]="columns()" (addTask)="onAddTask($event)" (taskOpened)="onTaskOpened($event)" />
</div>
